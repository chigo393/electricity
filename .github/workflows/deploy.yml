name: Deploy to Local VM

on:
  push:
    branches:
      - development  # Trigger workflow on push to 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest  # Use GitHub-hosted Ubuntu runner

    steps:
    # Step 1: Check out the repository code
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Set up SSH for secure connection to the VM
    # - Create SSH folder
    # - Save private key from GitHub secrets
    # - Set correct file permissions
    # - Add VM host to known_hosts to avoid SSH prompt
    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts
